; php-fpm, replacing the image's www/docker pool files. Runs as uid 10001; everything it writes lives in /tmp so the root filesystem can stay read-only.
[global]
error_log = /proc/self/fd/2
; Only problems from the master; per-request lines come from nginx.
log_level = warning
; JSON lines from workers longer than the 1 KB default would be split mid-object.
log_limit = 8192
pid = /tmp/php-fpm.pid
daemonize = no

[app]
; Only used if started as root (the build-time config test); as uid 10001 fpm ignores it.
user = app
group = nogroup
listen = /tmp/php-fpm.sock
listen.mode = 0600

; static: the task's memory is fixed, so a fixed worker count is the predictable choice.
; Sizing: (task memory - opcache 128M - nginx/supervisord ~40M) / ~40M per Symfony worker.
; small (512M) -> 8. memory_limit (256M) caps one request, not the average. Set
; PHP_FPM_MAX_CHILDREN per environment for medium/large instead of editing this file.
pm = static
pm.max_children = ${PHP_FPM_MAX_CHILDREN}
; Recycle workers now and then so a slow leak never becomes an OOM kill.
pm.max_requests = 1000
; Below the ALB idle timeout (60 s), so a stuck request ends here with a logged error.
request_terminate_timeout = 55s

; ECS passes SERVICE, TEAM, ENVIRONMENT, VERSION, DB_* as env vars; keep them for PHP.
clear_env = no
; The app's JSON logger writes to stderr: pass worker output through, byte for byte.
catch_workers_output = yes
decorate_workers_output = no
; nginx logs every request; no duplicate access log here.
access.log = /dev/null
