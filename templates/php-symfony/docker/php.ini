; Production PHP settings on top of php.ini-production.
expose_php = Off
memory_limit = 256M
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
; Code never changes inside an immutable image.
opcache.validate_timestamps = 0
realpath_cache_size = 4096K
realpath_cache_ttl = 600
