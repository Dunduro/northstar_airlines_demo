; supervisord keeps php-fpm and nginx running in one container. No control socket (nothing
; uses supervisorctl), its own log off; children log straight to the container's stdout/stderr.
[supervisord]
nodaemon = true
logfile = /dev/null
logfile_maxbytes = 0
pidfile = /tmp/supervisord.pid
; Only crashes and restarts, as plain lines; request and app logs are JSON.
loglevel = warn

[program:php-fpm]
command = php-fpm --nodaemonize
priority = 10
autorestart = true
; QUIT = graceful: finish in-flight requests. Within ECS's 30 s stopTimeout.
stopsignal = QUIT
stopwaitsecs = 20
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

; Higher priority number: starts after php-fpm, stops before it (no 502s on shutdown).
[program:nginx]
command = nginx -e /dev/stderr
priority = 20
autorestart = true
stopsignal = QUIT
stopwaitsecs = 20
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

; If either process keeps crashing (FATAL), stop the container so ECS replaces the task
; instead of leaving a half-alive one behind the ALB.
[eventlistener:exit-on-fatal]
command = sh -c 'printf "READY\n"; while read -r _; do kill -TERM "$PPID"; done'
events = PROCESS_STATE_FATAL
stdout_logfile = NONE
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0
