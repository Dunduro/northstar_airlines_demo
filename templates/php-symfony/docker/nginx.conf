# nginx in front of php-fpm. Plain HTTP on 8080: TLS ends at the ALB. Runs as uid 10001, so
# no `user` directive; pid and temp files go to /tmp for the read-only root filesystem.
daemon off;
pid /tmp/nginx.pid;
# One worker is plenty for a local hop to php-fpm; scale with tasks, not workers.
worker_processes 1;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 75s;  # above the ALB idle timeout (60 s), as AWS recommends
    client_max_body_size 10m;

    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    # $uri is /index.php after try_files; log and filter on the path the client asked for,
    # without the query string (it can carry tokens).
    map $request_uri $request_path {
        ~^(?<p>[^?]*) $p;
    }
    # The ALB probes /health every few seconds; keep those out of the log.
    map $request_path $loggable {
        /health 0;
        default 1;
    }
    # One JSON object per request, same field names as the app's logger where they overlap.
    log_format json escape=json '{"timestamp":"$time_iso8601","level":"info","message":"request",'
        '"source":"nginx","method":"$request_method","path":"$request_path","status":$status,'
        '"duration_s":$request_time,"bytes":$body_bytes_sent,'
        '"correlation_id":"$sent_http_x_correlation_id","client_ip":"$http_x_forwarded_for",'
        '"user_agent":"$http_user_agent"}';
    access_log /dev/stdout json if=$loggable;

    gzip on;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;

    server {
        listen 8080;
        root /app/public;

        # Static files straight from disk; everything else to Symfony's front controller.
        location / {
            try_files $uri /index.php$is_args$args;
        }

        location ~ ^/index\.php(/|$) {
            fastcgi_pass unix:/tmp/php-fpm.sock;
            fastcgi_split_path_info ^(.+\.php)(/.*)$;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
            # /index.php/foo must not be reachable directly.
            internal;
        }

        # Never execute or serve any other .php file.
        location ~ \.php$ {
            return 404;
        }
    }
}
