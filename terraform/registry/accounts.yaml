# Account registry — the single source of intent for the estate.
# One entry per AWS account. Terraform (org/, baseline/) and the platform simulator read this file.
# Adding an entry = a new account gets its OU, baseline and access; nothing is configured by hand.
# Account IDs are fictitious (PoC).

accounts:
  # --- Core accounts (platform + security) ---
  - id: "100000000001"
    name: security-audit
    environment: core
    team: security
    owner: security-lead@northstar.example
    ou: Security
    flavours: []
    baseline_version: "2.3.0"
  - id: "100000000002"
    name: log-archive
    environment: core
    team: security
    owner: security-lead@northstar.example
    ou: Security
    flavours: []
    baseline_version: "2.3.0"
  # Central backup vault (Vault Lock, compliance mode). Security OU, not Infrastructure: the
  # people who run workloads must not be able to delete the copy that protects them from it.
  - id: "100000000005"
    name: backup
    environment: core
    team: security
    owner: security-lead@northstar.example
    ou: Security
    flavours: []
    baseline_version: "2.3.0"
  - id: "100000000003"
    name: network
    environment: core
    team: platform
    owner: platform-lead@northstar.example
    ou: Infrastructure
    flavours: []
    baseline_version: "2.3.0"
